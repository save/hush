name: Bug report
description: Something broke or looks wrong
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Site and page
      placeholder: youtube.com/watch
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: With hush on and, if you can, with hush off (Alt ⇧ H).
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131
